name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: build x86_64 loader
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nasm gcc-mingw-w64-x86-64 gcc-mingw-w64-i686 \
            qemu-system-x86 mtools dosfstools curl
      - name: Build BOOTIA32.EFI
        run: |
          make TOOLCHAIN_PREFIX=/usr/bin/ all
          sha256sum BOOTIA32.EFI
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BOOTIA32.EFI
          path: BOOTIA32.EFI

  boot-test:
    name: tcg boot smoke test (32-bit fw + 64-bit CPU)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 mtools dosfstools curl
      - name: Download built loader
        uses: actions/download-artifact@v4
        with:
          name: BOOTIA32.EFI
          path: .
      - name: Fetch IA32 OVMF from efi32boot repo
        run: |
          curl -fsSL -o OVMF32.fd \
            https://raw.githubusercontent.com/devtinoimao/efi32boot/main/OVMF32.fd
          ls -la OVMF32.fd
      - name: TCG boot test
        run: |
          dd if=/dev/zero of=esp_ci.img bs=1M count=64 status=none
          mkfs.vfat -F 32 -n ESP esp_ci.img
          mmd -i esp_ci.img ::/EFI ::/EFI/BOOT
          mcopy -i esp_ci.img BOOTIA32.EFI ::/EFI/BOOT/BOOTIA32.EFI
          timeout 600 qemu-system-x86_64 \
            -accel tcg -cpu qemu64 -m 2048 -smp 2 -display none \
            -serial file:boot.log \
            -bios OVMF32.fd \
            -drive format=raw,file=esp_ci.img || true
          echo "=== boot log tail ==="
          tail -c 2000 boot.log | tr -d '\000' || true
          if grep -qa "HELLO FROM 64-BIT LONG MODE" boot.log && \
             grep -qa "M1 marker set" boot.log; then
            echo "PASS: 32-bit firmware launched 64-bit long-mode code"
          else
            echo "FAIL: long-mode payload did not run"
            exit 1
          fi
      - name: Upload debug artifacts (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-debug
          path: boot.log

  cross-arch:
    name: cross-compile checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            cc: gcc-aarch64-linux-gnu
          - arch: riscv64
            cc: gcc-riscv64-unknown-elf
          - arch: ppc64le
            cc: gcc-powerpc64le-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - name: Install cross toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ${{ matrix.cc }}
      - name: Toolchain check
        run: ${{ matrix.arch == 'riscv64' && 'riscv64-unknown-elf-gcc' || format('{0}-linux-gnu-gcc', matrix.arch) }} --version
